"evento": "Elecciones de medio término en EE.UU.", "impacto": "Alto", "fuente": "https://www.mufgresearch.com/rates/september-2026-fed-rates-call-update/"}, {"fecha": "2026-11-17", "evento": "Balance de NVIDIA", "impacto": "Alto", "fuente": "https://finance.yahoo.com/quote/NVDA/"}, {"fecha": "2026-12-09", "evento": "Última decisión de tasas de la Fed del año", "impacto": "Alto", "fuente": "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"}], "contexto": {"actualizado": "2026-10-14", "semana": "Semana del 12 al 16 de octubre de 2026", "titular": "Petróleo arriba de US$100, Fed que vuelve a subir tasas y un golpe a los chips de memoria", "resumen": "El mercado opera con tres fuerzas cruzadas. El Brent se mantiene por encima de US$100 por los ataques en el Estrecho de Ormuz y la falta de un acuerdo EE.UU.–Irán, lo que empuja a las petroleras y a la inflación. Esa inflación (se espera 3,6–3,7% anual en el CPI de septiembre) llevó a la Fed a subir la tasa a 3,75–4,00% en septiembre y mantiene la tasa a 10 años cerca de 5,25%, un nivel que castiga a las empresas de crecimiento y a los emergentes. Además, los avances del fabricante chino CXMT en memorias desataron una venta fuerte en Micron, Arm y Super Micro. En Argentina el CCL ronda $1.610, el riesgo país está cerca de 600 puntos y el BCRA ya compró más de US$15.000 millones en el año.", "temas": [{"tema": "Oil & Gas", "estado": "positivo", "texto": "Brent entre US$105 y US$106 y WTI sobre US$90. BMI espera que el Brent siga arriba de US$100 por meses porque no ve un acuerdo con Irán antes de 2027. Las productoras (Vista, YPF, Petrobras, ConocoPhillips) son las más beneficiadas; un acuerdo diplomático sorpresivo es el principal riesgo a la baja.", "fuentes": [{"nombre": "Yahoo Finance: ataques en Ormuz", "url": "https://finance.yahoo.com/markets/article/oil-prices-climb-above-100-on-strait-of-hormuz-attacks-gulf-storm-threat-122612488.html"}, {"nombre": "OilPrice: BMI ve Brent > US$100", "url": "https://oilprice.com/Latest-Energy-News/World-News/BMI-Predicts-Brent-Crude-Will-Remain-Above-100-for-Months.amp.html"}]}, {"tema": "IA y semiconductores", "estado": "negativo", "texto": "Semana de corrección: Micron cayó cuatro ruedas seguidas y SK Hynix más de 10% tras los avances de la china CXMT en chips de memoria. El sector igual acumula casi +100% en 12 meses. TSMC presenta balance el 15/10 y NVIDIA el 17/11: son los próximos termómetros de la demanda de IA.", "fuentes": [{"nombre": "CNBC: memorias caen por segundo día", "url": "https://www.cnbc.com/2026/10/13/sk-hynix-softbank-samsung-electronics-shares-tech-stocks-fall.html"}, {"nombre": "Yahoo Finance: CXMT y Micron", "url": "https://finance.yahoo.com/markets/stocks/articles/china-cxmt-broadcom-ceo-rattle-173756730.html"}]}, {"tema": "Fed, tasas e inflación", "estado": "negativo", "texto": "La Fed subió 25 pb en septiembre (primera suba desde 2023) y 16 de 18 miembros ven al menos otra suba este año. El mercado asigna cerca de 80% de chances a una pausa el 28/10, cerca de las elecciones de medio término. Un CPI núcleo alto reabriría la puerta a otra suba.", "fuentes": [{"nombre": "Chase: tono de la Fed antes del FOMC", "url": "https://www.chase.com/personal/investments/learning-and-insights/article/federal-reserve-officials-hawkish-tone-ahead-of-october-2026-fomc-meeting"}, {"nombre": "MUFG Research: Fed & Rates", "url": "https://www.mufgresearch.com/rates/september-2026-fed-rates-call-update/"}]}, {"tema": "Transición energética y nuclear", "estado": "neutral", "texto": "Señales mixtas. Google firmó un contrato a 20 años por 890 MW nucleares con Constellation Energy, una validación de la nuclear como fuente para data centers. En cambio, litio y tierras raras siguen débiles: el precio del litio cayó 20% en un mes y Lithium Americas y MP Materials acumulan fuertes bajas. Las tasas altas pesan sobre proyectos intensivos en capital.", "fuentes": [{"nombre": "Engineering News: Google y Constellation", "url": "https://w const HL = { semana: "la última semana", mes: "el último mes", anio: "los últimos 12 meses" };
const S = { view: "resumen", h: "semana", cur: "usd", dir: 1, theme: "", noEtf: false, open: null, ntab: null, more: false };
try { Object.assign(S, JSON.parse(localStorage.getItem("pizarra-movil") || "{}")); } catch (e) {}
const VIEWS = ["resumen", "ranking", "ideas", "agenda", "noticias"];
if (VIEWS.includes(location.hash.slice(1))) S.view = location.hash.slice(1);
const save = () => { try { localStorage.setItem("pizarra-movil", JSON.stringify({ view: S.view, h: S.h, cur: S.cur, dir: S.dir, noEtf: S.noEtf })); } catch (e) {} };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (v, d = 1) => v == null ? "—" : (v > 0 ? "+" : "") + (v * 100).toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
const cls = (v) => v == null ? "" : v >= 0 ? "up" : "down";
const nf = (v, d = 2) => v == null ? "—" : v.toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d });
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fd = (s) => { const [y, m, d] = s.split("-"); return `${+d}/${+m}`; };
const ret = (a, h = S.h) => S.cur === "ars" ? (a.ars ? a.ars[h] : null) : a[h];
const find = (t) => D.activos.find((a) => a.ticker === t);

function spark(vals, w, h) {
  if (!vals || vals.length < 2) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * (w - 4) + 2, h - 3 - ((v - mn) / rg) * (h - 6)]);
  const c = vals[vals.length - 1] >= vals[0] ? "var(--up)" : "var(--down)";
  const line = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const [lx, ly] = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="2,${h} ${line} ${w - 2},${h}" fill="${c}" opacity="0.12"/><polyline points="${line}" fill="none" stroke="${c}" stroke-width="1.4" vector-effect="non-scaling-stroke"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2" fill="${c}"/></svg>`;
}

function barra() {
  const c = D.contexto || {};
  $("#week").textContent = c.semana ? c.semana.replace("Semana del ", "Sem. ") : "Datos al " + fd(D.fecha_datos);
  const k = D.ccl;
  $("#ccl").innerHTML = k ? `<span class="eyebrow">CCL</span><br><b>$${nf(k.valor, 0)}</b><small class="${cls(k[S.h])}">${pct(k[S.h])}</small>` : "";
  $("#hz").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === S.h));
  $("#cur").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === S.cur));
  $("#tabs").querySelectorAll("button").forEach((b) => b.dataset.v === S.view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
}

function resumen() {
  const c = D.contexto || {};
  const macro = D.macro.map((m) => {
    const v = m.ticker === "^TNX" ? nf(m.valor, 2) + "%" : m.valor >= 10000 ? nf(m.valor, 0) : nf(m.valor, 2);
    return `<div class="tile"><span class="n">${esc(m.nombre)}</span><span class="v">${v}</span><span class="c ${cls(m[S.h])}">${pct(m[S.h])}</span>${spark(m.spark, 120, 24)}</div>`;
  }).join("");
  const rad = D.radar.filter((r) => r[S.h] != null).sort((a, b) => b[S.h] - a[S.h]);
  const mx = Math.max(...rad.map((r) => Math.abs(r[S.h])), 0.01);
  const bars = rad.map((r) => { const v = r[S.h], w = Math.abs(v) / mx * 50;
    return `<div class="brow"><span class="t">${esc(r.tema)}</span><span class="track"><i style="${v >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`};background:var(${v >= 0 ? "--up" : "--down"})"></i></span><span class="num ${cls(v)}">${pct(v)}</span></div>`; }).join("");
  const res = c.resumen || "";
  const corto = res.length > 260 && !S.more ? res.slice(0, res.lastIndexOf(" ", 240)) + "…" : res;
  $("#v-resumen").innerHTML = `
    <div class="card lead"><span class="eyebrow">Lectura de la semana</span><h2>${esc(c.titular || "Sin análisis cargado")}</h2><p>${esc(corto)}</p>
      ${res.length > 260 ? `<button class="more" type="button" id="more">${S.more ? "Ver menos" : "Leer todo"}</button>` : ""}</div>
    <div class="block"><h2>Mercados <small>${HL[S.h]}</small></h2><div class="strip">${macro}</div></div>
    <div class="block"><h2>Radar temático <small>${HL[S.h]}</small></h2><div class="card bars">${bars}</div></div>
    <div class="block"><h2>Temas clave</h2>${(c.temas || []).map((t) => `<details class="theme"><summary><span class="dot ${esc(t.estado)}"></span><h3>${esc(t.tema)}</h3></summary>
      <div class="body"><p>${esc(t.texto)}</p><div class="srcs">${(t.fuentes || []).map((f) => `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.nombre)}</a>`).join("")}</div></div></details>`).join("")}</div>
    <div class="foot"><p>Precios al ${fd(D.fecha_datos)} · generado ${esc(D.generado)}. Fuentes: Yahoo Finance y Google News.</p><p>Información educativa. No es asesoramiento financiero.</p><p><a href="index.html?completo">Ver la versión completa</a></p></div>`;
  const b = $("#more"); if (b) b.onclick = () => { S.more = !S.more; resumen(); };
}

function ranking() {
  const temas = [...new Set(D.activos.map((a) => a.tema))].sort();
  const list = D.activos.filter((a) => (!S.theme || a.tema === S.theme) && (!S.noEtf || !a.es_etf) && ret(a) != null)
    .sort((a, b) => S.dir * (ret(b) - ret(a))).slice(0, S.theme ? 10 : 5);
  const rows = list.map((a, i) => {
    const v = ret(a), open = S.open === a.ticker, n = (a.noticias || [])[0];
    return `<div class="row"><button type="button" data-t="${esc(a.ticker)}" aria-expanded="${open}"><span class="pos">${i + 1}</span>
      <span><span class="tk">${esc(a.ticker)}</span><span class="nm">${esc(a.nombre)}</span></span>
      <span class="rt"><span class="pill ${cls(v)}">${pct(v)}</span>${spark(a.spark, 64, 20)}</span></button>
      ${open ? `<div class="detail"><span><span class="chip">${esc(a.tema)}</span></span><p>${esc(a.desc)}</p>
        <div class="kv"><div><span>Semana</span><b class="${cls(ret(a, "semana"))}">${pct(ret(a, "semana"))}</b></div><div><span>Mes</span><b class="${cls(ret(a, "mes"))}">${pct(ret(a, "mes"))}</b></div><div><span>12 meses</span><b class="${cls(ret(a, "anio"))}">${pct(ret(a, "anio"))}</b></div>
        <div><span>Precio US$</span><b>${nf(a.precio)}</b></div><div><span>RSI</span><b>${nf(a.rsi, 0)}</b></div><div><span>vs. máximo</span><b>${pct(a.dist_max)}</b></div></div>
        ${n ? `<div class="nw"><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titulo)}</a> <span class="src">· ${esc(n.fuente)}</span></div>` : ""}</div>` : ""}</div>`;
  }).join("");
  $("#v-ranking").innerHTML = `
    <div class="toggle"><button type="button" class="g" data-d="1" aria-pressed="${S.dir === 1}">▲ Más subieron</button><button type="button" class="p" data-d="-1" aria-pressed="${S.dir === -1}">▼ Más bajaron</button></div>
    <div class="filters"><select id="th" aria-label="Sector"><option value="">Todos los sectores</option>${temas.map((t) => `<option ${t === S.theme ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <label class="ck"><input type="checkbox" id="etf" ${S.noEtf ? "checked" : ""}> Sin ETFs</label></div>
    <div class="block"><h2>Top ${S.theme ? 10 : 5} <small>${HL[S.h]} · ${S.cur === "ars" ? "en pesos" : "en dólares"}</small></h2><div class="list">${rows || '<p class="empty">Sin datos para este filtro.</p>'}</div></div>
    <p class="note">Tocá un activo para ver qué es, sus tres plazos y una noticia reciente.</p>`;
  $("#v-ranking").querySelectorAll(".toggle button").forEach((b) => b.onclick = () => { S.dir = +b.dataset.d; S.open = null; save(); ranking(); });
  $("#v-ranking").querySelectorAll(".row > button").forEach((b) => b.onclick = () => { S.open = S.open === b.dataset.t ? null : b.dataset.t; ranking(); });
  $("#th").onchange = (e) => { S.theme = e.target.value; ranking(); };
  $("#etf").onchange = (e) => { S.noEtf = e.target.checked; save(); ranking(); };
}

const SIG = {
  momentum: ["Tendencia fuerte cerca de máximos", "Precio sobre medias de 50 y 200 ruedas, RSI 50–70, a menos de 5% del máximo.", "up"],
  retroceso: ["Retroceso en tendencia alcista", "Sobre la media de 200 ruedas, +10% en el año y RSI < 40.", "up"],
  cruce: ["Cruce dorado reciente", "La media de 50 cruzó arriba de la de 200.", "up"],
  sobreventa: ["Sobreventa", "RSI < 30. Rebote posible, contra la tendencia.", "down"],
  sobrecompra: ["Recalentados", "RSI > 75. Suelen consolidar.", "down"],
};
function ideas() {
  const c = D.contexto || {};
  const ideas = (c.oportunidades || []).map((o) => `<div class="card idea"><h3>${esc(o.titulo)}</h3>
    <div class="tks">${(o.tickers || []).map((t) => { const a = find(t); return `<span class="tkb">${esc(t)}${a ? ` <span class="${cls(ret(a))}">${pct(ret(a))}</span>` : ""}</span>`; }).join("")}</div>
    <p>${esc(o.texto)}</p><p class="risk">Riesgo: ${esc(o.riesgo)}</p></div>`).join("");
  const sigs = Object.entries(SIG).map(([k, [t, regla, tone]]) => {
    const l = D.activos.filter((a) => a.senales.some((s) => s[0] === k)).sort((a, b) => (b.anio ?? 0) - (a.anio ?? 0)).slice(0, 6);
    return `<details class="theme sig"><summary><span class="dot ${tone === "up" ? "positivo" : "negativo"}"></span><h3>${t}</h3><span class="muted num">${l.length}</span></summary>
      <div class="body"><div class="rule">${regla}</div><ul>${l.map((a) => `<li><span class="tk">${esc(a.ticker)}</span><span class="nm">${esc(a.nombre)}</span><span class="num muted">RSI ${nf(a.rsi, 0)}</span></li>`).join("") || '<li><span></span><span class="muted">Ninguno esta semana</span><span></span></li>'}</ul></div></details>`;
  }).join("");
  const s = D.seguimiento;
  let track = "";
  if (s && s.filas.length) {
    const by = {}; s.filas.forEach((f) => (by[f.tipo] ||= []).push(f));
    track = `<div class="block"><h2>Señales del ${fd(s.desde)} <small>cómo les fue</small></h2><div class="card bars">${Object.entries(by).map(([k, fs]) => { const avg = fs.reduce((t, f) => t + f.var, 0) / fs.length;
      return `<div class="brow" style="grid-template-columns:minmax(0,1fr) 64px"><span class="t">${SIG[k] ? SIG[k][0] : k} (${fs.length})</span><span class="num ${cls(avg)}">${pct(avg)}</span></div>`; }).join("")}</div></div>`;
  }
  $("#v-ideas").innerHTML = `<div class="block"><h2>Oportunidades a analizar</h2>${ideas || '<p class="empty">Sin ideas cargadas.</p>'}</div>
    <div class="block"><h2>Señales técnicas</h2><div class="sigs">${sigs}</div></div>${track}
    <p class="note">Filtro informativo y educativo, no una recomendación personalizada. Verificá con tu asesor o ALyC y revisá la liquidez del CEDEAR en BYMA antes de operar.</p>`;
}

function agenda() {
  const c = D.contexto || {};
  const ev = (D.eventos || []).map((e) => { const [y, m, d] = e.fecha.split("-");
    return `<div class="ev"><span class="d"><b>${+d}</b>${MESES[+m - 1]}</span><div>${e.fuente ? `<a href="${esc(e.fuente)}" target="_blank" rel="noopener">${esc(e.evento)}</a>` : esc(e.evento)}<span class="imp">${esc(e.impacto || "")}</span></div></div>`; }).join("");
  const by = {}; (D.balances || []).forEach((b) => (by[b.fecha] ||= []).push(b.ticker));
  const bal = Object.entries(by).map(([f, ts]) => { const [y, m, d] = f.split("-");
    return `<div class="ev"><span class="d"><b>${+d}</b>${MESES[+m - 1]}</span><div class="earn">${ts.map((t) => `<span class="tkb">${esc(t)}</span>`).join("")}</div></div>`; }).join("");
  $("#v-agenda").innerHTML = `<div class="block"><h2>Eventos clave</h2><div class="card">${ev || '<p class="empty">Sin eventos cargados.</p>'}</div></div>
    <div class="block"><h2>Riesgos a vigilar</h2><div class="card"><ul class="risks">${(c.riesgos || []).map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div></div>
    <div class="block"><h2>Balances <small>próximas 3 semanas</small></h2><div class="card">${bal || '<p class="empty">Sin balances próximos.</p>'}</div></div>`;
}

function noticias() {
  const cats = Object.keys(D.noticias || {}).filter((k) => D.noticias[k].length);
  if (!cats.includes(S.ntab)) S.ntab = cats[0];
  $("#v-noticias").innerHTML = `<div class="chips" role="tablist">${cats.map((k) => `<button type="button" role="tab" aria-selected="${k === S.ntab}" data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div>
    <div class="card"><ul class="news">${(D.noticias[S.ntab] || []).map((n) => `<li><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titulo)}<span class="meta">${esc(n.fuente)}${n.fecha ? " · " + fd(n.fecha) : ""}</span></a></li>`).join("")}</ul></div>`;
  $("#v-noticias").querySelectorAll(".chips button").forEach((b) => b.onclick = () => { S.ntab = b.dataset.k; noticias(); });
}

const RENDER = { resumen, ranking, ideas, agenda, noticias };
function show(v) {
  S.view = v; save();
  VIEWS.forEach((x) => { $("#v-" + x).hidden = x !== v; });
  barra(); RENDER[v](); window.scrollTo(0, 0);
}
$("#tabs").querySelectorAll("button").forEach((b) => b.onclick = () => show(b.dataset.v));
$("#hz").querySelectorAll("button").forEach((b) => b.onclick = () => { S.h = b.dataset.v; save(); barra(); RENDER[S.view](); });
$("#cur").querySelectorAll("button").forEach((b) => b.onclick = () => { S.cur = b.dataset.v; save(); barra(); RENDER[S.view](); });

if (D) show(S.view);
else $("main").innerHTML = '<p class="empty">No hay datos. Ejecutá build.py.</p>';
</script>
