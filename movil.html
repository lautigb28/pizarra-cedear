ra la tecnología: el índice de semiconductores de Filadelfia cayó ocho ruedas seguidas, su peor racha desde 2008, y el Nasdaq perdió cerca de 4,5%, su peor semana desde junio, por dudas sobre si el gasto en infraestructura de IA va a rendir. El CPI de septiembre dio 3,7% anual con un núcleo más alto de lo esperado, lo que volvió a poner sobre la mesa una suba de la Fed el 28/10. El Brent cerró en US$109,86 tras tocar US$110 por los ataques iraníes en Ormuz, y el VIX subió a la zona de 20. Las petroleras y la defensa fueron los grandes ganadores. En Argentina el CCL siguió estable cerca de $1.613, pero el riesgo país rozó los 650 puntos, cerca de su máximo del año.", "temas": [{"tema": "IA y semiconductores", "estado": "negativo", "texto": "El índice de semis cayó 3,8% el viernes y encadenó ocho bajas seguidas, la racha más larga desde 2008. El viernes AMD e Intel perdieron cerca de 6%, Micron 5,6% y Broadcom 4,5%, mientras NVIDIA solo cedió 1,4%. El temor es que la construcción de data centers haya ido más rápido que la capacidad de cobrarla, y CoreWeave cayó 12% por dudas sobre su financiamiento. Como contrapeso, TSMC presentó un trimestre récord (ingresos +41% anual en dólares) y dijo que la demanda de IA sigue superando su capacidad de producción. JPMorgan calificó la venta de exagerada.", "fuentes": [{"nombre": "24/7 Wall St.: 8 días de caída en chips", "url": "https://247wallst.com/investing/2026/10/17/chip-stocks-just-fell-8-days-in-a-row-their-longest-losing-streak-since-2008/"}, {"nombre": "TheStreet: el mercado el 16/10", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-oct-16-2026"}, {"nombre": "Crypto Briefing: resultados de TSMC", "url": "https://cryptobriefing.com/tsmc-q3-2026-earnings-revenue-up-41/"}, {"nombre": "Let's Data Science: TSMC y la demanda de IA", "url": "https://letsdatascience.com/news/tsmc-says-ai-demand-still-exceeds-its-supply-capability-as-q-2fed75bf"}]}, {"tema": "Fed, tasas e in function spark(vals, w, h) {
  if (!vals || vals.length < 2) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * (w - 4) + 2, h - 3 - ((v - mn) / rg) * (h - 6)]);
  const c = vals[vals.length - 1] >= vals[0] ? "var(--up)" : "var(--down)";
  const line = pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const [lx, ly] = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="2,${h} ${line} ${w - 2},${h}" fill="${c}" opacity="0.12"/><polyline points="${line}" fill="none" stroke="${c}" stroke-width="1.4" vector-effect="non-scaling-stroke"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2" fill="${c}"/></svg>`;
}

      <span class="rt"><span class="pill ${cls(v)}">${pct(v)}</span>${spark(a.spark, 64, 20)}</span></button>
      ${open ? `<div class="detail"><span><span class="chip">${esc(a.tema)}</span></span><p>${esc(a.desc)}</p>
        <div class="kv"><div><span>Semana</span><b class="${cls(ret(a, "semana"))}">${pct(ret(a, "semana"))}</b></div><div><span>Mes</span><b class="${cls(ret(a, "mes"))}">${pct(ret(a, "mes"))}</b></div><div><span>12 meses</span><b class="${cls(ret(a, "anio"))}">${pct(ret(a, "anio"))}</b></div>
        <div><span>Precio US$</span><b>${nf(a.precio)}</b></div><div><span>RSI</span><b>${nf(a.rsi, 0)}</b></div><div><span>vs. máximo</span><b>${pct(a.dist_max)}</b></div></div>
        ${n ? `<div class="nw"><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titulo)}</a> <span class="src">· ${esc(n.fuente)}</span></div>` : ""}</div>` : ""}</div>`;
  }).join("");
  $("#v-ranking").innerHTML = `
    <div class="toggle"><button type="button" class="g" data-d="1" aria-pressed="${S.dir === 1}">▲ Más subieron</button><button type="button" class="p" data-d="-1" aria-pressed="${S.dir === -1}">▼ Más bajaron</button></div>
    <div class="filters"><select id="th" aria-label="Sector"><option value="">Todos los sectores</option>${temas.map((t) => `<option ${t === S.theme ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <label class="ck"><input type="checkbox" id="etf" ${S.noEtf ? "checked" : ""}> Sin ETFs</label></div>
    <div class="block"><h2>Top ${S.theme ? 10 : 5} <small>${HL[S.h]} · ${S.cur === "ars" ? "en pesos" : "en dólares"}</small></h2><div class="list">${rows || '<p class="empty">Sin datos para este filtro.</p>'}</div></div>
    <p class="note">Tocá un activo para ver qué es, sus tres plazos y una noticia reciente.</p>`;
  $("#v-ranking").querySelectorAll(".toggle button").forEach((b) => b.onclick = () => { S.dir = +b.dataset.d; S.open = null; save(); ranking(); });
  $("#v-ranking").querySelectorAll(".row > button").forEach((b) => b.onclick = () => { S.open = S.open === b.dataset.t ? null : b.dataset.t; ranking(); });
  $("#th").onchange = (e) => { S.theme = e.target.value; ranking(); };
  $("#etf").onchange = (e) => { S.noEtf = e.target.checked; save(); ranking(); };
}

const SIG = {
  momentum: ["Tendencia fuerte cerca de máximos", "Precio sobre medias de 50 y 200 ruedas, RSI 50–70, a menos de 5% del máximo.", "up"],
  retroceso: ["Retroceso en tendencia alcista", "Sobre la media de 200 ruedas, +10% en el año y RSI < 40.", "up"],
  cruce: ["Cruce dorado reciente", "La media de 50 cruzó arriba de la de 200.", "up"],
  sobreventa: ["Sobreventa", "RSI < 30. Rebote posible, contra la tendencia.", "down"],
  sobrecompra: ["Recalentados", "RSI > 75. Suelen consolidar.", "down"],
};
function ideas() {
  const c = D.contexto || {};
  const ideas = (c.oportunidades || []).map((o) => `<div class="card idea"><h3>${esc(o.titulo)}</h3>
    <div class="tks">${(o.tickers || []).map((t) => { const a = find(t); return `<span class="tkb">${esc(t)}${a ? ` <span class="${cls(ret(a))}">${pct(ret(a))}</span>` : ""}</span>`; }).join("")}</div>
    <p>${esc(o.texto)}</p><p class="risk">Riesgo: ${esc(o.riesgo)}</p></div>`).join("");
  const sigs = Object.entries(SIG).map(([k, [t, regla, tone]]) => {
    const l = D.activos.filter((a) => a.senales.some((s) => s[0] === k)).sort((a, b) => (b.anio ?? 0) - (a.anio ?? 0)).slice(0, 6);
    return `<details class="theme sig"><summary><span class="dot ${tone === "up" ? "positivo" : "negativo"}"></span><h3>${t}</h3><span class="muted num">${l.length}</span></summary>
      <div class="body"><div class="rule">${regla}</div><ul>${l.map((a) => `<li><span class="tk">${esc(a.ticker)}</span><span class="nm">${esc(a.nombre)}</span><span class="num muted">RSI ${nf(a.rsi, 0)}</span></li>`).join("") || '<li><span></span><span class="muted">Ninguno esta semana</span><span></span></li>'}</ul></div></details>`;
  }).join("");
  const s = D.seguimiento;
  let track = "";
  if (s && s.filas.length) {
    const by = {}; s.filas.forEach((f) => (by[f.tipo] ||= []).push(f));
    track = `<div class="block"><h2>Señales del ${fd(s.desde)} <small>cómo les fue</small></h2><div class="card bars">${Object.entries(by).map(([k, fs]) => { const avg = fs.reduce((t, f) => t + f.var, 0) / fs.length;
      return `<div class="brow" style="grid-template-columns:minmax(0,1fr) 64px"><span class="t">${SIG[k] ? SIG[k][0] : k} (${fs.length})</span><span class="num ${cls(avg)}">${pct(avg)}</span></div>`; }).join("")}</div></div>`;
  }
  $("#v-ideas").innerHTML = `<div class="block"><h2>Oportunidades a analizar</h2>${ideas || '<p class="empty">Sin ideas cargadas.</p>'}</div>
    <div class="block"><h2>Señales técnicas</h2><div class="sigs">${sigs}</div></div>${track}
    <p class="note">Filtro informativo y educativo, no una recomendación personalizada. Verificá con tu asesor o ALyC y revisá la liquidez del CEDEAR en BYMA antes de operar.</p>`;
}

function agenda() {
  const c = D.contexto || {};
  const ev = (D.eventos || []).map((e) => { const [y, m, d] = e.fecha.split("-");
    return `<div class="ev"><span class="d"><b>${+d}</b>${MESES[+m - 1]}</span><div>${e.fuente ? `<a href="${esc(e.fuente)}" target="_blank" rel="noopener">${esc(e.evento)}</a>` : esc(e.evento)}<span class="imp">${esc(e.impacto || "")}</span></div></div>`; }).join("");
  const by = {}; (D.balances || []).forEach((b) => (by[b.fecha] ||= []).push(b.ticker));
  const bal = Object.entries(by).map(([f, ts]) => { const [y, m, d] = f.split("-");
    return `<div class="ev"><span class="d"><b>${+d}</b>${MESES[+m - 1]}</span><div class="earn">${ts.map((t) => `<span class="tkb">${esc(t)}</span>`).join("")}</div></div>`; }).join("");
  $("#v-agenda").innerHTML = `<div class="block"><h2>Eventos clave</h2><div class="card">${ev || '<p class="empty">Sin eventos cargados.</p>'}</div></div>
    <div class="block"><h2>Riesgos a vigilar</h2><div class="card"><ul class="risks">${(c.riesgos || []).map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div></div>
    <div class="block"><h2>Balances <small>próximas 3 semanas</small></h2><div class="card">${bal || '<p class="empty">Sin balances próximos.</p>'}</div></div>`;
}

function noticias() {
  const cats = Object.keys(D.noticias || {}).filter((k) => D.noticias[k].length);
  if (!cats.includes(S.ntab)) S.ntab = cats[0];
  $("#v-noticias").innerHTML = `<div class="chips" role="tablist">${cats.map((k) => `<button type="button" role="tab" aria-selected="${k === S.ntab}" data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div>
    <div class="card"><ul class="news">${(D.noticias[S.ntab] || []).map((n) => `<li><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titulo)}<span class="meta">${esc(n.fuente)}${n.fecha ? " · " + fd(n.fecha) : ""}</span></a></li>`).join("")}</ul></div>`;
  $("#v-noticias").querySelectorAll(".chips button").forEach((b) => b.onclick = () => { S.ntab = b.dataset.k; noticias(); });
}

const RENDER = { resumen, ranking, ideas, agenda, noticias };
function show(v) {
  S.view = v; save();
  VIEWS.forEach((x) => { $("#v-" + x).hidden = x !== v; });
  barra(); RENDER[v](); window.scrollTo(0, 0);
}
$("#tabs").querySelectorAll("button").forEach((b) => b.onclick = () => show(b.dataset.v));
$("#hz").querySelectorAll("button").forEach((b) => b.onclick = () => { S.h = b.dataset.v; save(); barra(); RENDER[S.view](); });
$("#cur").querySelectorAll("button").forEach((b) => b.onclick = () => { S.cur = b.dataset.v; save(); barra(); RENDER[S.view](); });

if (D) show(S.view);
else $("main").innerHTML = '<p class="empty">No hay datos. Ejecutá build.py.</p>';
</script>
